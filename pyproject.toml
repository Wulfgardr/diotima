[project]
name = "diotima"
version = "0.0.1"
description = "Open, auditable evidence synthesis for Claude and Codex: every claim tied to a verified passage."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Leonardo Pegollo" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]
keywords = ["evidence synthesis", "systematic review", "citations", "mcp", "claude", "codex"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
diotima = "diotima.cli:main"
diotima-mcp = "diotima.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diotima"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/diotima/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_brand.py" = ["E501"]  # inline SVG markup
